spring:
  application:
    name: vertex-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:240000}
      keepalive-time: ${DATABASE_KEEPALIVE_MS:120000}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

server:
  port: ${PORT:8080}
  forward-headers-strategy: native

vertex:
  frontend-url: ${APP_FRONTEND_URL}
  github-token: ${GITHUB_TOKEN:}
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: ${GEMINI_MODEL:gemini-2.0-flash}
  jwt-secret: ${JWT_SECRET}
  internal-api-key: ${INTERNAL_API_KEY}
  collector-enabled: ${COLLECTOR_ENABLED:false}
  allowed-origins: ${ALLOWED_ORIGINS}
